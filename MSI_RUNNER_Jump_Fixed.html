*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:none}
html,body{margin:0;height:100%;background:#07080f;overflow:hidden;font-family:monospace}
body{display:flex;align-items:center;justify-content:center;flex-direction:column}
#game{image-rendering:pixelated;image-rendering:crisp-edges;background:#000;box-shadow:0 0 0 2px #e30613,0 0 40px #e3061355;width:100vw;height:100vh;max-width:none;max-height:none;display:block}
#touch{display:none;position:fixed;left:0;right:0;bottom:0;height:150px;padding:0 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
#touch.show{display:block}
#touch .grp{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;pointer-events:auto}
#touch .l{left:14px}#touch .r{right:14px;gap:6px;align-items:flex-end}
#touch button{width:52px;height:56px;border-radius:50%;border:2px solid #ffffff55;background:#e3061388;color:#fff;font:bold 13px monospace;letter-spacing:1px}
#touch button.dir{border-radius:14px;background:#1a2036aa;width:62px;font-size:24px}
#touch button[data-k="skill1"],#touch button[data-k="skill2"],#touch button[data-k="skill3"]{width:48px;height:48px;font-size:11px;line-height:14px;border-radius:10px;border-color:#ff5965;background:#15101dcc}
#touch button[data-k="skill3"]{border-color:#ffd24a;background:#6b250dcc}
#touch button.on{background:#ffd24acc;color:#000;transform:scale(.94)}
#touch .pause{position:absolute;top:-34px;right:14px;width:44px;height:30px;border-radius:8px;font-size:11px;pointer-events:auto;background:#1a2036aa}
@media (orientation:landscape) and (max-height:500px){#touch{height:100%;} #touch button{opacity:.75} #touch .pause{top:8px}}
</style>

cv.width = W; cv.height = H;
g.imageSmoothingEnabled = false;

function fit() {
  // Edge-to-edge viewport fill; the game is presented in a 16:9 full-screen frame.
  cv.style.width = '100vw';
  cv.style.height = '100dvh';
}
addEventListener('resize', fit); fit();

function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; }
function R(x, col, a, b, w, h) { x.fillStyle = col; x.fillRect(a, b, w, h); }
function disk(x, col, cx, cy, r) { x.fillStyle = col; for (let y = -r; y <= r; y++) { const w = Math.floor(Math.sqrt(r * r + r * .5 - y * y) + .0001); x.fillRect(cx - w, cy + y, w * 2 + 1, 1); } }
function ring(x, col, cx, cy, r) { x.fillStyle = col; for (let a = 0; a < 360; a += 6) { const px = Math.round(cx + Math.cos(a * Math.PI / 180) * r), py = Math.round(cy + Math.sin(a * Math.PI / 180) * r); x.fillRect(px, py, 1, 1); } }

/* ---------- input ---------- */
const held = {}, press = {}, touchHeld = {}, touchP = {};
const In = {};
addEventListener('keydown', e => {
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
  if (!held[e.code]) press[e.code] = true;
  held[e.code] = true;
  if (window.Snd) Snd.unlock();
});
addEventListener('keyup', e => { held[e.code] = false; });
addEventListener('blur', () => { for (const k in held) held[k] = false; for (const k in touchHeld) touchHeld[k] = false; });
function pollInput() {
  const hk = (...c) => c.some(x => held[x]), pk = (...c) => c.some(x => press[x]);
  In.l = hk('ArrowLeft', 'KeyA') || touchHeld.left;
  In.r = hk('ArrowRight', 'KeyD') || touchHeld.right;
  In.u = hk('ArrowUp', 'KeyW') || touchHeld.up;
  In.d = hk('ArrowDown', 'KeyS') || touchHeld.down;
  In.jump = hk('Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyK') || touchHeld.jump;
  In.jumpP = pk('Space', 'ArrowUp', 'KeyW', 'KeyZ', 'KeyK') || touchP.jump;

/* ============ SPRITES: all pixel art is generated in code ============ */
function gnew(w, h) { return { w, h, d: new Array(w * h).fill(null) }; }
function gset(G, x, y, c) { x = Math.floor(x); y = Math.floor(y); if (x < 0 || y < 0 || x >= G.w || y >= G.h) return; G.d[y * G.w + x] = c; }

function gpoly(G, pts, c) {
  let mn = 1e9, mx = -1e9; for (const p of pts) { mn = Math.min(mn, p[1]); mx = Math.max(mx, p[1]); }
  for (let y = Math.floor(mn); y <= Math.ceil(mx); y++) {
    const yy = y + .5, xs = [];
    for (let i = 0; i < pts.length; i++) { const a = pts[i], b = pts[(i + 1) % pts.length]; if ((a[1] <= yy && b[1] > yy) || (b[1] <= yy && a[1] > yy)) xs.push(a[0] + (yy - a[1]) / (b[1] - a[1]) * (b[0] - a[0])); }

    const i = y * G.w + x; if (G.d[i] !== base) continue;
    if (gget(G, x, y - 1) !== base) o[i] = hi;
    else if (gget(G, x, y + 1) !== base) o[i] = dk;
    else if (gget(G, x + 1, y) !== base) o[i] = dk;

}

const DRAGON_RED = { body: '#e8101f', hi: '#ff6a74', dk: '#a30a14', belly: '#ffe9bd', bellyDk: '#e9c88e', wing: '#f7a62e', wingHi: '#ffd873', wingDk: '#c9771a', horn: '#fff0cc', ol: '#3a0610', eye: '#ffffff', pupil: '#1c0509', cheek: '#ff8d96', mouth: '#6a0a14', claw: '#ffffff' };

function drawDragon(P, o) {
  const G = gnew(30, 28), ox = 2, oy = 2 + (o.bob || 0);

  if (o.fire) { gpart(G, S => { E(S, -0.3, 21, 1.3, 1.6, '#ffd24a'); px(S, -0.5, 19, '#ff7a1a'); px(S, -0.5, 22, '#ff7a1a'); }, null); }
  const L = o.legs || [0, 0, 0, 0]; // [backx, backy, frontx, fronty] offsets
  const legCol = P.dk;
  gpart(G, S => { E(S, 6 + L[0], 21.8 + L[1], 2.5, 2.1, legCol); }, null);
  gpart(G, S => { E(S, 10, 15.5, 7.5, 6.5, P.body); }, P.body, P.hi, P.dk);
  gpart(G, S => { E(S, 12.6, 17, 3.7, 4.5, P.belly); }, P.belly, P.belly, P.bellyDk);
  // wing
  const wa = o.wing === undefined ? 1 : o.wing; // 0 up, 1 mid, 2 down
  const ph = [12, 52, 98][wa] * Math.PI / 180, dir = [-Math.sin(ph), -Math.cos(ph)], pe = [Math.cos(ph), -Math.sin(ph)];
  const evo = o.evo || 0;
  const b1 = [6.5, 12.5], b2 = [11, 11], len = 9.5 + evo * 2.2;

  if (evo >= 3) gpart(G, S => { PO(S, [[5,17],[7,8],[9,14]], '#fff0cc'); PO(S, [[9,16],[12,7],[14,14]], '#fff0cc'); PO(S, [[13,17],[16,9],[18,15]], '#fff0cc'); }, null);
  gpart(G, S => { E(S, 13.6 + L[2], 21.8 + L[3], 2.5, 2.1, P.body); }, P.body, P.hi, P.dk);

const DR = {}; // dragon frames: DR[pal+fire][name]
function buildDragonFrames() {
  const defs = {
    idle0: { wing: 1 }, idle1: { wing: 0, bob: 1 }, blink: { wing: 1, blink: true },
    run0: { wing: 1, legs: [-1.5, 0, 1.5, -1.2], bob: 0 }, run1: { wing: 0, legs: [0, 0, 0, 0], bob: -1 }, run2: { wing: 1, legs: [1.5, -1.2, -1.5, 0], bob: 0 }, run3: { wing: 2, legs: [0, 0, 0, 0], bob: -1 },
    jump: { wing: 0, legs: [-0.5, -1.2, 1, -1.2] }, fall: { wing: 2, legs: [-1.5, 0.6, 2, 0.6] },
    breath: { wing: 1, breath: true }, hurt: { wing: 2, hurt: true, legs: [0, -1, 0, -1] }, dead: { wing: 2, dead: true, legs: [-1, -1, 1, -1] }
  };
  for (const [pn, P] of [['red', DRAGON_RED], ['blue', DRAGON_BLUE]]) for (const fire of [false, true]) {
    const k = pn + (fire ? 'F' : ''); DR[k] = {};
    for (const n in defs) DR[k][n] = gcanvas(drawDragon(P, { ...defs[n], fire }));
  }

  DR.evo = [];
  for (let evo = 0; evo < 4; evo++) { DR.evo[evo] = {}; for (const fire of [false, true]) { const pal = fire ? 'redF' : 'red'; DR.evo[evo][pal] = {}; for (const n in defs) DR.evo[evo][pal][n] = gcanvas(drawDragon(DRAGON_RED, { ...defs[n], fire, evo })); } }

  DR.bossBig = {};

    const G = drawDragon(DRAGON_RED, { wing: n === 'jump' ? 0 : (n === 'run2' ? 2 : 1), evo: 3, legs: n === 'run0' ? [-1.5, 0, 1.5, -1.2] : n === 'run2' ? [1.5, -1.2, -1.5, 0] : n === 'jump' ? [-.5, -1.2, 1, -1.2] : [0, 0, 0, 0], hurt: n === 'hurt', dead: n === 'dead', breath: n === 'breath' });

    gpart(G, S => { gell(S, 15,14,3.2,3.2,'#e30613'); gell(S,15,14,1.5,1.5,'#ffb02a'); gset(S,15,11,'#fff'); }, null);
    for(let k=0;k<3;k++){ R_(G, 5+k*2, 17, 1, 3, '#ff3344'); R_(G, 20+k, 17, 1, 3, '#ff3344'); }
    gpart(G, S => { gpoly(S, [[5,7],[7,2],[9,7]], '#252b38'); gpoly(S, [[12,4],[14,0],[16,5]], '#252b38'); gpoly(S, [[18,5],[21,1],[22,7]], '#252b38'); }, null);
    if(n==='dead'){ for(let k=0;k<4;k++) R_(G, 9+k*3, 8+k%2, 2, 1, '#ffb02a'); }

  }
}

function update() {
  switch (Gm.state) {
    case 'title': updTitle(); break; case 'map': updMap(); break; case 'shop': updShop(); break; case 'play': updPlay(); break; case 'card': updCard(); break;
    case 'pause': updPause(); break; case 'build': updBuild(); break; case 'ending': updEnding(); break;
  }
}
function render() {

    case 'pause': drawPause(); break; case 'build': drawBuild(); break; case 'ending': drawEnding(); break;
  }
  if (isTouch && Gm.state === 'play') { }
}

{
  let last = performance.now(), acc = 0; const STEP = 1000 / 60;

    acc += Math.min(100, ts - last); last = ts;
